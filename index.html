
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Housing Price Prediction</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    .card {
      max-width: 560px;
      margin: auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { text-align: center; color: #166534; }
    .subtitle { text-align: center; color: #64748b; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #15803d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result {
      margin-top: 22px;
      padding: 16px;
      border-radius: 8px;
      background: #f0fdf4;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🏠 Housing Price Prediction</h1>
    <p class="subtitle">Enter house details to estimate its price.</p>

    <form id="prediction-form">
      <label for="size">House Size</label>
      <input id="size" type="number" min="0.01" step="any" value="1500" required>

      <label for="bedrooms">Bedrooms</label>
      <input id="bedrooms" type="number" min="0" step="1" value="3" required>

      <label for="bathrooms">Bathrooms</label>
      <input id="bathrooms" type="number" min="0" step="any" value="2" required>

      <label for="age">House Age (years)</label>
      <input id="age" type="number" min="0" step="1" value="10" required>

      <label for="distance">Distance to City Center (miles)</label>
      <input id="distance" type="number" min="0" step="any" value="5" required>

      <label for="floors">Floors</label>
      <input id="floors" type="number" min="1" step="1" value="2" required>

      <button id="submit" type="submit">Predict House Price</button>
    </form>

    <section id="result" class="hidden" aria-live="polite"></section>
  </main>

  <script>
    const form = document.getElementById("prediction-form");
    const result = document.getElementById("result");
    const button = document.getElementById("submit");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.classList.remove("hidden");
      result.textContent = "Calculating prediction...";
      button.disabled = true;

      const payload = {
        House_Size: Number(document.getElementById("size").value),
        bedrooms: Number(document.getElementById("bedrooms").value),
        bathrooms: Number(document.getElementById("bathrooms").value),
        "House Age": Number(document.getElementById("age").value),
        "Distance to City Center (miles)": Number(document.getElementById("distance").value),
        Floors: Number(document.getElementById("floors").value)
      };

      try {
        const response = await fetch("/api", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Prediction failed");

        result.textContent =
          "Estimated House Price: " +
          new Intl.NumberFormat("en-US", {
            style: "currency",
            currency: "USD"
          }).format(data.prediction);
      } catch (error) {
        result.textContent = "Error: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
